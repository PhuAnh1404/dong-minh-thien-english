<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Bạn đã sẵn sàng để khám phá trình độ tiếng Anh của bản thân chưa?✨✨✨*</title>
    <link rel="icon" href="assets/img/favicon.png">
    <script async src="https://tally.so/widgets/embed.js"></script>
    <style type="text/css">
      html { margin: 0; height: 100%; overflow: hidden; }
      iframe { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border: 0; }
    </style>
  </head>
  <body>
    <iframe data-tally-src="https://tally.so/r/rj7OPp" width="100%" height="100%" frameborder="0" marginheight="0" marginwidth="0" title="Bạn đã sẵn sàng để khám phá trình độ tiếng Anh của bản thân chưa?✨✨✨*"></iframe>
    <script>
      /* Dự phòng: nếu script Tally tải chậm, vẫn gắn form vào khung */
      window.addEventListener('load', function () {
        setTimeout(function () {
          document.querySelectorAll('iframe[data-tally-src]:not([src])').forEach(function (e) { e.src = e.dataset.tallySrc; });
        }, 1500);
      });
    </script>
  </body>
</html>
